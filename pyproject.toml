[tool.poetry]
name = "devpulse"
version = "0.1.0"
description = "CLI tool for git hygiene, live PR status, and note indexing."
authors = ["devpulse contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "devpulse" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = { version = "^0.9.0", extras = ["all"] }
httpx = "^0.24.0"
rich = "^13.4.0"

[tool.poetry.scripts]
devpulse = "devpulse.cli:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"